[config]
skip_git_env_info = true

[tasks.clippy]
clear        = true
dependencies = ["native-clippy", "windows-clippy", "wasm-clippy"]
workspace    = false

[tasks.native-clippy]
args      = ["clippy", "--workspace", "--all-targets", "--all-features"]
command   = "cargo"
toolchain = "nightly"
workspace = false

[tasks.clippy-native]
alias = "native-clippy"

# Checks the Windows-only code paths; needs no Windows linker.
[tasks.windows-clippy]
args = [
    "clippy",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--target",
    "x86_64-pc-windows-gnu",
]
extend = "native-clippy"

[tasks.clippy-windows]
alias = "windows-clippy"

# The command-line app is not built for the browser.
[tasks.wasm-clippy]
args = [
    "clippy",
    "--workspace",
    "--exclude",
    "psm",
    "--all-targets",
    "--all-features",
    "--target",
    "wasm32-unknown-unknown",
]
extend = "native-clippy"

[tasks.clippy-wasm]
alias = "wasm-clippy"

[tasks.audit]
args          = ["audit", "--deny", "warnings"]
command       = "cargo"
install_crate = "cargo-audit"
workspace     = false

[tasks.fmt]
args      = ["fmt", "--all"]
command   = "cargo"
toolchain = "nightly"
workspace = false

[tasks.fmt-check]
args   = ["fmt", "--all", "--check"]
extend = "fmt"

[tasks.toml-fmt]
args          = ["fmt"]
command       = "taplo"
install_crate = { crate_name = "taplo-cli", binary = "taplo", test_arg = "--version" }
workspace     = false

[tasks.toml-fmt-check]
args   = ["fmt", "--check"]
extend = "toml-fmt"

[tasks.format]
clear        = true
dependencies = ["fmt", "toml-fmt"]
workspace    = false

[tasks.format-check]
clear        = true
dependencies = ["fmt-check", "toml-fmt-check"]
workspace    = false

[tasks.test]
args      = ["test", "--workspace"]
clear     = true
command   = "cargo"
workspace = false

[tasks.selftest]
args      = ["run", "--release", "--package", "psm", "--", "selftest"]
command   = "cargo"
workspace = false

# Recomputes every test vector with the independent Python implementation.
[tasks.reference]
args      = ["-I", "reference/psm_ref.py", "verify", "spec/vectors-v1.json"]
command   = "python3"
workspace = false

[tasks.build]
args      = ["build", "--release", "--package", "psm"]
clear     = true
command   = "cargo"
workspace = false

# Release archive for this machine, or `cargo make dist web`; see scripts/dist.sh.
[tasks.dist]
args      = ["scripts/dist.sh", "${@}"]
command   = "sh"
workspace = false

# The browser app as one file, target/web/psm.html. Needs the wasm32 target and
# a wasm-bindgen-cli of the same version as the wasm-bindgen crate.
[tasks.web-build]
args      = ["scripts/build-web.py"]
command   = "python3"
workspace = false

[tasks.build-web]
alias = "web-build"

# Runs every test vector through the WebAssembly core embedded in psm.html.
[tasks.web-test]
dependencies = ["web-build"]
script = '''
node --check crates/web/ui/app.js
node crates/web/test/vectors.mjs target/web/psm.html spec/vectors-v1.json
'''
workspace = false

# Uses psm.html in headless Firefox; needs Node.js 22 or later.
[tasks.web-browser-test]
args = [
    "crates/web/test/browser.mjs",
    "target/web/psm.html",
    "spec/vectors-v1.json",
]
command = "node"
dependencies = ["web-build"]
workspace = false

[tasks.ci]
clear = true
dependencies = [
    "format-check",
    "audit",
    "clippy",
    "test",
    "selftest",
    "reference",
    "web-test",
    "web-browser-test",
]
workspace = false
