[workspace]
members  = ["crates/cli", "crates/core", "crates/web"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
version = "0.1.0"

[workspace.lints.rust]
nonstandard_style = "deny"
unsafe_code       = "deny"

[workspace.lints.clippy]
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

default_trait_access = "allow"
match_same_arms      = "allow"
missing_errors_doc   = "allow"
missing_panics_doc   = "allow"
needless_for_each    = "allow"
similar_names        = "allow"
too_many_arguments   = "allow"
too_many_lines       = "allow"

allow_attributes                = "warn"
allow_attributes_without_reason = "warn"
dbg_macro                       = "warn"
exit                            = "warn"
expect_used                     = "warn"
let_underscore_must_use         = "warn"
mem_forget                      = "warn"
panic                           = "warn"
print_stderr                    = "warn"
print_stdout                    = "warn"
todo                            = "warn"
unimplemented                   = "warn"
unreachable                     = "warn"
unwrap_in_result                = "warn"
unwrap_used                     = "warn"
wildcard_enum_match_arm         = "warn"

# Argon2 with 64 MiB is painfully slow unoptimized; keep debug builds and
# tests usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto           = true
strip         = true

# The browser build keeps the `target_features` section that wasm-bindgen
# reads; wasm-bindgen drops the name sections instead.
[profile.wasm]
inherits = "release"
strip    = false
