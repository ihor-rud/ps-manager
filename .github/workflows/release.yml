name: release

# Pushing a tag such as v0.1.0 builds every archive and opens a draft release
# with them and their SHA-256 checksums. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        run: test "$GITHUB_REF_NAME" = "v$(cargo pkgid --package psm | sed 's/.*@//')"

  cli:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Statically linked, so it runs on any x86-64 Linux distribution.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: scripts/dist.sh ${{ matrix.target }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: psm-${{ matrix.target }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
          if-no-files-found: error

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock.
      - run: cargo install --locked wasm-bindgen-cli --version "$(cargo pkgid wasm-bindgen | sed 's/.*@//')"
      - run: scripts/dist.sh web
      - uses: actions/upload-artifact@v4
        with:
          name: psm-web
          path: target/dist/*.html
          if-no-files-found: error

  publish:
    needs: [cli, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --draft
